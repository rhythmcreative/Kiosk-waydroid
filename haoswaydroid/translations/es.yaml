configuration:
  apk_url:
    name: "URL de APK personalizada"
    description: "URL directa opcional a un APK de Kiosk-Satellite personalizado. Déjalo en blanco para descargar automáticamente la última versión oficial."
  auto_update_apk:
    name: "Actualizar APK automáticamente"
    description: "Descarga e instala automáticamente nuevas versiones de Kiosk Satellite cuando se publiquen."
  auto_launch_kiosk:
    name: "Iniciar Kiosk Satellite automáticamente"
    description: "Lanza Kiosk Satellite automáticamente al iniciar el complemento. Desactívalo si quieres iniciar Android sin abrir la app."
  display_width:
    name: "Ancho de pantalla"
    description: "Ancho de resolución personalizado en píxeles (0 para nativo/automático)."
  display_height:
    name: "Alto de pantalla"
    description: "Alto de resolución personalizado en píxeles (0 para nativo/automático)."
  display_dpi:
    name: "DPI de pantalla"
    description: "Densidad de píxeles DPI de la pantalla (0 para automático)."
  display_orientation:
    name: "Orientación de pantalla"
    description: "Orientación y rotación de pantalla (auto, portrait, landscape, reverse-portrait, reverse-landscape)."
  remote_admin_port:
    name: "Puerto Web de Administración Remota"
    description: "Puerto para acceder a la interfaz web de administración remota de Kiosk Satellite (por defecto: 2324)."
  esphome_api_port:
    name: "Puerto API ESPHome"
    description: "Puerto del host redirigido a la API ESPHome de Kiosk Satellite dentro de Waydroid (por defecto: 6056 para evitar colisiones con otros satélites de voz en 6053/6055). El proxy detecta dinámicamente y redirige a cualquier puerto interno que use la app (6055, 6053 o este puerto). 0 para desactivar."
  esphome_advertise:
    name: "Anunciar ESPHome por mDNS"
    description: "Publica _esphomelib._tcp en la LAN incluyendo la dirección MAC del dispositivo para que Home Assistant lo detecte inmediatamente en Dispositivos Descubiertos. Requiere esphome_api_port > 0."
  esphome_node_name:
    name: "Nombre de nodo ESPHome"
    description: "Nombre de instancia mDNS (por defecto: waydroid). Coincide con Ajustes > ESPHome > Node name en la app. Debe ser único por kiosco."
  enable_camera:
    name: "Habilitar Cámara"
    description: "Permitir a Kiosk Satellite acceso a cámaras para gestos y transmisión de video."
  audio_output_device:
    name: "Dispositivo de salida de audio"
    description: "Salida de audio preferida: 'auto' (respeta la selección de Home Assistant o prefiere ReSpeaker), 'hdmi' (fuerza salida HDMI de la pantalla) o 'respeaker' (fuerza altavoz/jack de ReSpeaker)."
  audio_input_device:
    name: "Dispositivo de entrada de audio"
    description: "Micrófono de entrada preferido: 'auto' (respeta la selección de Home Assistant o prefiere micro ReSpeaker), 'respeaker' (fuerza micrófono ReSpeaker) o 'default'."
  audio_volume:
    name: "Volumen de Audio"
    description: "Nivel de volumen de salida de audio (0 a 100)."
  keep_alive:
    name: "Mantener aplicación activa"
    description: "Volver a iniciar Kiosk Satellite automáticamente si se cierra."
